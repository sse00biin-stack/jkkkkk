<!doctype html>
<html lang="ko">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--pink:#ff3d8d;--hot:#ff176d;--orange:#ff8c35;--yellow:#ffe761;--ink:#35132f;--cream:#fffaf0;--purple:#6b43db;--shadow:0 12px 0 rgba(151,45,95,.13),0 22px 45px rgba(109,37,93,.13)}
    *{box-sizing:border-box}html{min-height:100%;background:#ffdf8a}body{margin:0;min-height:100vh;color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo",sans-serif;background:radial-gradient(ellipse at 10% 12%,#fff36c 0,transparent 23%),radial-gradient(ellipse at 92% 20%,#ffad4c 0,transparent 26%),radial-gradient(ellipse at 82% 86%,#ff77ac 0,transparent 28%),linear-gradient(140deg,#ffb348,#ff6d9d 54%,#ffdc6b);overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E")}
    .spark{position:fixed;z-index:0;color:white;text-shadow:0 2px 10px #ff58a0;animation:twinkle 2.8s ease-in-out infinite;pointer-events:none}.s1{top:8%;left:7%;font-size:30px}.s2{top:21%;right:7%;font-size:22px;animation-delay:.7s}.s3{bottom:12%;left:5%;font-size:24px;animation-delay:1.2s}.s4{bottom:25%;right:6%;font-size:32px;animation-delay:.4s}@keyframes twinkle{50%{transform:rotate(18deg) scale(1.25);opacity:.65}}
    .shell{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}.app{width:min(100%,560px);margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;margin:0 7px 12px;color:#71284d;font-size:12px;font-weight:800;letter-spacing:.08em}.brand{font-family:Jua,sans-serif;font-size:16px}.counter{background:#fff8dcaa;padding:7px 11px;border:1px solid #fff;border-radius:20px}
    .card{position:relative;background:var(--cream);border:3px solid white;border-radius:34px;padding:clamp(24px,6vw,42px);box-shadow:var(--shadow);overflow:hidden}.card:before{content:"";position:absolute;inset:0 0 auto;height:9px;background:linear-gradient(90deg,#ff357f,#ff9b36,#ffe654,#ff56a0)}.screen{animation:appear .38s cubic-bezier(.2,.8,.2,1)}@keyframes appear{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
    .eyebrow{display:inline-flex;align-items:center;gap:6px;color:#9a4771;background:#ffe5ef;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:800}.hero-title{font:clamp(44px,12vw,70px)/.98 Jua,sans-serif;letter-spacing:-.04em;margin:19px 0 14px;color:#ff397f;text-shadow:0 3px 0 #fff,0 6px 0 #ffc142,0 10px 19px #ed69935c;transform:rotate(-2deg)}h1,h2,h3,p{margin-top:0}h2{font:clamp(26px,7vw,34px)/1.2 Jua,sans-serif;letter-spacing:-.02em;margin:18px 0 12px}p{line-height:1.7;color:#71485e}.intro-copy{font-size:16px}.sticker{display:flex;align-items:center;justify-content:center;width:108px;height:95px;margin:17px auto 16px;background:linear-gradient(145deg,#ffe861,#ff9c36 55%,#ff5a9c);border:4px solid #fff;border-radius:39% 61% 58% 42%/50% 43% 57% 50%;box-shadow:0 8px 0 #ffc7d9,0 12px 22px #ef729055;font-size:53px;transform:rotate(7deg)}.tiny{font-size:12px;color:#93677d}.consent{background:#fff0d1;border:1px dashed #ff9a5c;border-radius:18px;padding:14px 16px;margin:18px 0;font-size:13px;line-height:1.65;color:#704b45}.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:700}.consent input{accent-color:var(--hot);width:19px;height:19px;flex:none;margin:1px 0 0}
    .progress{height:9px;background:#ffe1ed;border-radius:99px;margin:18px 0 22px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff458b,#ff9a32,#ffe35d);border-radius:inherit;transition:width .3s}.qnum{font-size:12px;font-weight:800;color:#df5c88;letter-spacing:.12em}.prompt{font:clamp(24px,6vw,31px)/1.25 Jua,sans-serif;margin:12px 0 18px}.choices{display:grid;gap:12px}.choice{width:100%;text-align:left;background:#fff;border:2px solid #f4dbe4;border-radius:21px;padding:17px 18px;color:var(--ink);font:600 15px/1.5 Pretendard,sans-serif;cursor:pointer;transition:.18s;box-shadow:0 4px 0 #f7e1e9}.choice:hover{transform:translateY(-2px);border-color:#ff8db8;background:#fff7fa}.choice.selected{border-color:var(--pink);background:#fff0f6;box-shadow:0 4px 0 #ffc2d8,0 0 0 3px #ffb3cf55}.choice .emoji{font-size:26px;margin-right:10px;vertical-align:middle}.choice small{display:block;color:#9a7285;font-size:12px;margin:4px 0 0 40px;font-weight:500}.actions{display:flex;gap:10px;margin-top:24px}.btn{border:0;border-radius:18px;padding:15px 20px;font:800 15px Pretendard,sans-serif;cursor:pointer;transition:.18s}.btn:active{transform:translateY(2px)}.btn-primary{flex:1;background:linear-gradient(135deg,#ff4389,#ff7957 75%,#ffad3d);color:white;box-shadow:0 6px 0 #d94178,0 10px 18px #ee67904f}.btn-primary:hover{filter:saturate(1.12);transform:translateY(-2px)}.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none}.btn-quiet{background:#fff0f5;color:#a34870}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 6px}.rating{background:#fff;border:2px solid #f2dce5;border-radius:17px;padding:12px 4px;color:#7a4962;font-weight:800;font-size:16px;cursor:pointer}.rating span{display:block;font-size:10px;font-weight:600;margin-top:3px}.rating.selected{background:#ffedf4;border-color:#ff5b97;color:#e72d72;box-shadow:0 3px 0 #ffc0d5}.scale-labels{display:flex;justify-content:space-between;color:#a27a8b;font-size:11px}.art{background:radial-gradient(circle at 25% 15%,#ffe95b,transparent 32%),radial-gradient(circle at 82% 20%,#ffb341,transparent 30%),linear-gradient(145deg,#ff5b9e,#f83c85 55%,#ff9b5b);border:4px solid #fff;border-radius:28px;padding:24px;text-align:center;min-height:206px;box-shadow:inset 0 0 35px #fff3,0 8px 0 #ffd2e0;position:relative;overflow:hidden}.art:after{content:"✦　·　✧";position:absolute;right:13px;top:10px;color:#fff9;font-size:21px}.art-icon{font-size:62px;filter:drop-shadow(0 5px 2px #a92c6755)}.art-title{font:30px Jua,sans-serif;color:white;text-shadow:0 3px 0 #e23877,0 6px 14px #9d214a77;margin:5px}.art-sub{color:#fff;font-size:12px;margin:0}.condition{display:inline-block;margin:0 auto 13px;border-radius:99px;background:#fff0d0;color:#a74d40;padding:7px 12px;font-size:12px;font-weight:800}.question-rating{background:#fff7f9;border-radius:19px;padding:15px 14px;margin:13px 0}.question-rating p{margin:0 0 8px;font-size:14px;font-weight:700;color:#633b51}.result-type{font:32px Jua,sans-serif;color:#f2387c}.debrief{background:#fff2d6;border-radius:20px;padding:17px;line-height:1.7;color:#68474d;font-size:14px}.footer{display:flex;justify-content:center;gap:18px;margin:19px 0 0;font-size:11px;color:#742e57}.footer a{color:inherit;text-decoration:none}.hidden{display:none!important}.admin-link{opacity:.65}.notice{font-size:12px;color:#967183;text-align:center;margin:15px 0 0}.err{color:#b62255;font-size:13px;font-weight:700;margin:12px 0}.admin-table{width:100%;border-collapse:collapse;font-size:12px;margin:14px 0}.admin-table th,.admin-table td{padding:9px 5px;border-bottom:1px solid #f1dce4;text-align:center}.admin-table th{color:#a34870}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#fff0f6;border-radius:16px;text-align:center;padding:14px}.stat strong{display:block;font:25px Jua;color:#ef4280}.stat span{font-size:11px;color:#8f6278}
    @media(max-width:480px){.shell{padding:16px 13px}.card{border-radius:28px;padding:25px 21px}.topline{margin:0 4px 10px}.choice{padding:15px}.question-rating{padding:13px 10px}.scale{gap:5px}.rating{padding:10px 2px}.rating span{font-size:9px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span><span class="spark s4">✧</span>
  <main class="shell"><div class="app">
    <div class="topline"><span class="brand">♡ HEART BEAT CLUB</span><span class="counter" id="counter">취향 탐험</span></div>
    <section class="card" id="card" aria-live="polite"></section>
    <footer class="footer"><span>당신의 취향은 반짝여요 ✨</span><a class="admin-link" href="?admin">운영자</a></footer>
  </div></main>
<script>
(() => {
  const STORE = 'heartbeat_study_responses_v1';
  const SESSION = 'heartbeat_study_current_v1';
  const questions = [
    {title:'처음 눈길이 가는 건?',choices:[['🪞','완벽하게 다듬어진 것','디테일 하나까지 매끈한 완성도'],['🧩','처음 보는 독특한 것','조금 서툴러도 나만의 분위기']]},
    {title:'주말 마켓에서 딱 하나만 데려온다면?',choices:[['🍊','어디에나 잘 어울리는 오브제','오래 봐도 질리지 않는 디자인'],['🪩','세상에 하나뿐인 오브제','볼 때마다 이야기가 생기는 디자인']]},
    {title:'친구가 만든 플레이리스트, 어떤 제목이 더 궁금해?',choices:[['🌷','오늘을 위한 포근한 노래','마음을 편하게 해주는 익숙한 무드'],['🛸','아무도 모르는 행��의 노래','어떤 분위기일지 상상이 안 되는 무드']]},
    {title:'선물 포장을 고른다면?',choices:[['🎀','깔끔한 리본과 단정한 포장','열기 전부터 기분 좋아지는 정성'],['🧡','손그림 메모가 붙은 포장','조금 삐뚤어도 기억에 남는 진심']]},
    {title:'나를 더 설레게 하는 초대장은?',choices:[['🌟','모두가 기다리는 인기 파티','사람들이 많이 찾는 이유가 궁금해'],['🌙','초대받은 사람만 아는 비밀 파티','나만 아는 특별한 순간 같아']]},
    {title:'마지막으로, 내 취향에 가까운 문장은?',choices:[['💎','오래 사랑받는 클래식','시간이 지나도 좋은 건 좋은 것'],['🦋','오늘 처음 만난 반짝임','새로운 느낌은 언제나 매력적']]}
  ];
  const ratingQuestions = [
    ['이 결과물이 매력적으로 느껴진다','매력도'],['이 결과물이 믿음직하고 완성도 있어 보인다','신뢰·완성도'],['다른 사람에게 보여주거나 공유하고 싶다','공유 의향'],['이 결과물은 나에게 가치가 있어 보인다','지각된 가치']
  ];
  const state = {step:0, answers:Array(questions.length).fill(null), ratings:Array(ratingQuestions.length).fill(null), consent:false, condition:null};
  const card = document.getElementById('card');
  const counter = document.getElementById('counter');
  const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const loadRows = () => { try { const x=JSON.parse(localStorage.getItem(STORE)||'[]'); return Array.isArray(x)?x:[]; } catch { return []; } };
  const persistSession = () => { try { sessionStorage.setItem(SESSION,JSON.stringify(state)); } catch {} };
  try { const saved=JSON.parse(sessionStorage.getItem(SESSION)||'null'); if(saved && Array.isArray(saved.answers)){Object.assign(state,saved);} } catch {}
  const freshCondition = () => {const rows=loadRows();const a=rows.filter(x=>x.condition==='A').length,b=rows.length-a;return a<=b?'A':'B';};
  function render(){
    const admin=new URLSearchParams(location.search).has('admin');
    if(admin){renderAdmin();return;}
    if(state.step===0){counter.textContent='취향 탐험';card.innerHTML=`<div class="screen"><div class="eyebrow">✦ 오늘의 미니 취향 테스트</div><div class="sticker" aria-hidden="true">💖</div><h1 class="hero-title">나의<br>하트비트!</h1><p class="intro-copy">당신은 무엇을 가치 있다고 느끼나요?<br>마음이 먼저 반응하는 순간을 따라가 봐요.</p><div class="consent"><label><input id="consent" type="checkbox" ${state.consent?'checked':''}><span>참여 전 안내를 확인했어요. 이 활동은 연구 실험에 활용되며, 응답은 익명으로 저장됩니다. 참여는 자발적이며 언제든 창을 닫아 중단할 수 있어요.</span></label></div><p class="tiny">약 2분 · 정답은 없어요 · 결과는 마지막에 공개돼요</p><div class="err hidden" id="err">계속하려면 연구 참여 안내에 동의해 주세요.</div><button class="btn btn-primary" id="start">내 취향 알아보기&nbsp; →</button></div>`;
      document.getElementById('consent').onchange=e=>{state.consent=e.target.checked;persistSession()};document.getElementById('start').onclick=()=>{if(!state.consent){document.getElementById('err').classList.remove('hidden');return}if(!state.condition)state.condition=freshCondition();state.step=1;persistSession();render()};return;}
    if(state.step>=1&&state.step<=questions.length){const i=state.step-1,q=questions[i];counter.textContent=`${i+1} / ${questions.length}`;const progress=Math.round(i/questions.length*100);card.innerHTML=`<div class="screen"><div class="qnum">YOUR VIBE · 0${i+1}</div><div class="progress"><i style="width:${progress}%"></i></div><h2 class="prompt">${q.title}</h2><p class="tiny">생각하기 전에, 끌리는 쪽을 골라봐요 ✨</p><div class="choices">${q.choices.map((c,j)=>`<button class="choice ${state.answers[i]===j?'selected':''}" data-choice="${j}"><span class="emoji">${c[0]}</span><strong>${c[1]}</strong><small>${c[2]}</small></button>`).join('')}</div><div class="actions">${i?'<button class="btn btn-quiet" id="back">← 이전</button>':''}<button class="btn btn-primary" id="next" ${state.answers[i]===null?'disabled':''}>${i===questions.length-1?'다음, 심사하러 가기':'다음 질문 →'}</button></div></div>`;card.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.answers[i]=Number(b.dataset.choice);persistSession();render()});const next=document.getElementById('next');next.onclick=()=>{if(state.answers[i]!==null){state.step++;persistSession();render()}};const back=document.getElementById('back');if(back)back.onclick=()=>{state.step--;persistSession();render()};return;}
    if(state.step===questions.length+1){counter.textContent='특별한 결과';const rare=state.condition==='A';card.innerHTML=`<div class="screen"><div class="eyebrow">✦ 이제 당신이 심사위원!</div><h2>이 결과를 마주한<br>첫 느낌은 어때요?</h2><div class="condition">${rare?'🌟 아주 특별한 결과 · 상위 5%에게만':'💫 많은 사람이 공통으로 받는 결과'}</div><div class="art" role="img" aria-label="분홍색과 오렌지색의 반짝이는 하트 작품"><div class="art-icon">💗</div><div class="art-title">HEART GLOW</div><p class="art-sub">a little light, made of you</p></div><p class="tiny" style="text-align:center;margin:13px 0 4px">작품을 천천히 보고, 느낌을 골라주세요</p>${ratingQuestions.map((r,i)=>`<div class="question-rating"><p>${r[0]}</p><div class="scale">${[1,2,3,4,5].map(n=>`<button class="rating ${state.ratings[i]===n?'selected':''}" data-rate="${i}" data-value="${n}" aria-label="${n}점">${n}<span>${n===1?'전혀':n===5?'매우':' '}</span></button>`).join('')}</div><div class="scale-labels"><span>그렇지 않아요</span><span>정말 그래요</span></div></div>`).join('')}<div class="err ${state.ratings.includes(null)?'':'hidden'}" id="err">각 항목을 별점으로 평가해 주세요.</div><button class="btn btn-primary" id="finish">내 취향 결과 보기 ✨</button></div>`;card.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{state.ratings[Number(b.dataset.rate)]=Number(b.dataset.value);persistSession();render()});document.getElementById('finish').onclick=saveResponse;return;}
    if(state.step===questions.length+2){counter.textContent='나의 결과';const score=state.answers.reduce((n,x)=>n+(x===1?1:0),0);let type,title,desc;if(score>=4){type='반짝임 수집가';title='새로움에 심장이 쿵!';desc='남들이 아직 발견하지 못한 매력을 알아보는 당신. 낯선 반짝임을 자기만의 감각으로 빛내는 타입이에요.'}else if(score<=2){type='무드 큐레이터';title='좋은 감각은 오래 남아';desc='마음에 드는 것의 이유를 차분히 알아보는 당신. 익숙한 아름다움 속에서도 작은 차이를 발견해요.'}else{type='하트비트 믹서';title='두근거림의 균형을 아는';desc='완성도와 새로운 감각 사이를 자유롭게 오가는 당신. 상황마다 가장 잘 어울리는 가치를 골라내요.'}card.innerHTML=`<div class="screen" style="text-align:center"><div class="sticker" style="margin-top:4px">✨</div><div class="eyebrow">✦ 당신의 하트비트 결과</div><h2 class="result-type">${type}</h2><h3 style="font:21px Jua;color:#8f4480;margin:6px 0">${title}</h3><p>${desc}</p><div class="debrief"><strong>잠깐, 실험의 비밀을 공개할게요 🫧</strong><br>이 테스트는 같은 작품을 보여드리면서 소개 문구만 다르게 제시해, 희소하다는 정보가 작품의 가치 판단에 어떤 영향을 주는지 알아보는 연구예요. 참가자는 무작위로 두 조건 중 하나에 배정되었고, 작품은 모든 참가자에게 동일했어요. 소개 문구는 연구를 위해 실제와 다르게 안내한 것으로, 혼란을 드렸다면 미안해요. 응답은 익명으로 기록되며 연구 목적으로만 사용됩니다.<br><br>함께해 주셔서 정말 고마워요! 💖</div><p class="tiny" style="margin-top:15px">연구 관련 질문이나 응답 철회 요청은 연구 운영자에게 문의해 주세요.</p><button class="btn btn-primary" id="again">반짝이는 하루 보내기 ♡</button></div>`;document.getElementById('again').onclick=()=>{sessionStorage.removeItem(SESSION);location.href=location.pathname};return;}
  }
  function saveResponse(){if(state.ratings.includes(null)){document.getElementById('err').classList.remove('hidden');return}const rows=loadRows();const row={id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`,completedAt:new Date().toISOString(),condition:state.condition,answers:[...state.answers],ratings:[...state.ratings],consent:true};rows.push(row);try{localStorage.setItem(STORE,JSON.stringify(rows));state.step=questions.length+2;persistSession();render()}catch{const e=document.getElementById('err');e.textContent='저장 공간이 부족해 응답을 저장하지 못했어요.';e.classList.remove('hidden')}}
  function renderAdmin(){counter.textContent='운영자 대시보드';const rows=loadRows();const groups=['A','B'].map(key=>rows.filter(x=>x.condition===key));const metrics=ratingQuestions.map((q,i)=>({label:q[1],a:mean(groups[0],i),b:mean(groups[1],i)}));card.innerHTML=`<div class="screen"><div class="eyebrow">🔒 운영자용 · 이 기기에 저장된 데이터</div><h2>하트비트 실험 요약</h2><p class="tiny">응답은 현재 브라우저의 로컬 저장소에만 저장됩니다. 공유 서버로 전송되지 않습니다.</p><div class="stats"><div class="stat"><strong>${groups[0].length}</strong><span>A · 희소 정보 조건</span></div><div class="stat"><strong>${groups[1].length}</strong><span>B · 보편 정보 조건</span></div></div><table class="admin-table"><thead><tr><th>평가 항목</th><th>A 평균</th><th>B 평균</th><th>차이 (A−B)</th></tr></thead><tbody>${metrics.map(m=>`<tr><td>${m.label}</td><td>${fmt(m.a)}</td><td>${fmt(m.b)}</td><td>${m.a===null||m.b===null?'—':(m.a-m.b).toFixed(2)}</td></tr>`).join('')}</tbody></table><p class="tiny">평균 점수는 완료된 응답만 포함합니다. CSV에는 익명 응답 ID, 시각, 조건, 취향 답변과 평가 점수가 포함돼요.</p><div class="actions"><button class="btn btn-primary" id="export" ${rows.length?'':'disabled'}>CSV 다운로드 ↓</button><button class="btn btn-quiet" id="clear" ${rows.length?'':'disabled'}>데이터 삭제</button></div><p class="notice">운영자 페이지는 비밀번호로 보호되지 않습니다. 실제 연구 데이터는 보안된 서버와 접근제어를 갖춘 저장소를 사용하세요.</p><button class="btn btn-quiet" style="width:100%;margin-top:12px" id="home">← 테스트로 돌아가기</button></div>`;document.getElementById('home').onclick=()=>location.href=location.pathname;document.getElementById('export').onclick=exportCSV;document.getElementById('clear').onclick=()=>{if(confirm('이 브라우저에 저장된 모든 응답을 삭제할까요?')){localStorage.removeItem(STORE);render()}};}
  function mean(rows,i){const vals=rows.map(r=>r.ratings&&Number(r.ratings[i])).filter(Number.isFinite);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null}function fmt(n){return n===null?'—':n.toFixed(2)}
  function exportCSV(){const rows=loadRows();const head=['id','completed_at','condition',...questions.map((_,i)=>`preference_${i+1}`),...ratingQuestions.map((_,i)=>`rating_${i+1}`)];const lines=[head,...rows.map(r=>[r.id,r.completedAt,r.condition,...r.answers,...r.ratings])].map(row=>row.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(','));const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`heartbeat-responses-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)}
  render();
})();
</script>
</body>
</html>
